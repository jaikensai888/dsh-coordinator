<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Coordinator</title>
<!--
  The Coordinator's test console.

  Deliberately one file with no build step and no dependencies: it is served by the
  service it drives, so anything that needs compiling would also need a second
  process, a second port, and a reason to exist. Open /ui, pick a node, make a
  session, talk to it.

  Two rules the code below follows on purpose:

  - everything that came from a node is inserted with `textContent`, never
    `innerHTML`. Event payloads are arbitrary JSON produced by another machine;
    rendering them as markup would make a remote node able to script this page.
  - exactly one follow stream is open at a time, and switching sessions or nodes
    aborts the previous one before opening the next.
-->
<style>
  :root {
    --bg: #0b0e14;
    --surface: #11151d;
    --surface-2: #171c26;
    --surface-3: #1e2530;
    --line: #242c39;
    --line-soft: #1a212b;
    --text: #e6eaf2;
    --dim: #8a94a6;
    --faint: #5c6675;
    --accent: #4d8dff;
    --accent-dim: rgba(77, 141, 255, .14);
    --ok: #46c05f;
    --warn: #d9a441;
    --bad: #f06a60;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #232b38; border-radius: 6px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #2f3948; }
  ::-webkit-scrollbar-track { background: transparent; }

  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------- chrome */
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 14px;
    height: 48px; flex: none;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 13.5px; margin: 0; font-weight: 650; letter-spacing: .2px;
    display: flex; align-items: center; gap: 8px;
  }
  header h1::before {
    content: ''; width: 7px; height: 7px; border-radius: 2px;
    background: linear-gradient(135deg, var(--accent), #7ab0ff);
  }
  header .spacer { flex: 1; }

  .pill {
    font-family: var(--mono); font-size: 11px; line-height: 1; padding: 4px 9px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
    background: var(--surface-2); white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: #24512c; background: rgba(70, 192, 95, .08); }
  .pill.off { color: var(--faint); }

  button {
    font: inherit; font-size: 12.5px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px;
    cursor: pointer; transition: background .12s, border-color .12s, color .12s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--surface-3); border-color: #33405280; }
  button:active:not(:disabled) { transform: translateY(.5px); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
  button.primary:hover:not(:disabled) { background: #5f9aff; border-color: #5f9aff; }
  button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  button.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

  input, textarea {
    font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%;
    transition: border-color .12s, box-shadow .12s;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
  }

  /* -------------------------------------------------------------- panes */
  main { flex: 1; display: grid; grid-template-columns: 232px 264px 1fr; min-height: 0; }
  main > section {
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--line); background: var(--surface);
  }
  main > section:last-child { border-right: none; background: var(--bg); }
  .pane-head {
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    height: 40px; flex: none;
    border-bottom: 1px solid var(--line); color: var(--faint);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .9px;
  }
  .pane-head .spacer { flex: 1; }
  /*
    Labels are uppercased; identifiers are not. A session id and a stream id are
    things an operator copies into a curl command, so `FAKE-SESSION-2` is not a
    style choice, it is a transcription bug waiting to happen.
  */
  .pane-head #chat-title, .pane-head .pill, .pill { text-transform: none; letter-spacing: normal; }
  .pane-head button { padding: 4px 9px; font-size: 12px; }
  #sessionfilter-wrap { padding: 8px 10px 6px; flex: none; border-bottom: 1px solid var(--line-soft); }
  #sessionfilter { font-size: 12px; padding: 5px 9px; }
  .list { flex: 1; overflow-y: auto; }

  .row {
    padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 9px;
    border-left: 2px solid transparent; transition: background .1s;
  }
  .row + .row { border-top: 1px solid var(--line-soft); }
  .row:hover { background: var(--surface-2); }
  .row.active { background: var(--surface-2); border-left-color: var(--accent); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub {
    font-size: 11px; color: var(--faint); font-family: var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
  .dot.ready { background: var(--ok); box-shadow: 0 0 0 3px rgba(70, 192, 95, .14); }
  .dot.offline { background: #3d4756; }
  .dot.revoked { background: var(--bad); }

  .empty { padding: 28px 16px; color: var(--faint); font-size: 12.5px; text-align: center; line-height: 1.7; }

  /* --------------------------------------------------------------- chat */
  #log { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .frame { margin-bottom: 12px; }
  .frame .meta {
    display: flex; gap: 8px; align-items: baseline;
    font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-bottom: 4px;
  }
  .frame .kind { color: var(--dim); font-weight: 600; letter-spacing: .2px; }
  .frame .body {
    white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 9px 11px;
  }
  .frame.plain .body {
    background: none; border: none; padding: 0;
    font-family: inherit; font-size: 13.5px; line-height: 1.65;
  }
  .frame.raw .body { color: var(--dim); }
  .frame.sys .body { color: var(--warn); }
  .frame.err .body { color: var(--bad); }

  /* A real DSH emits ~15 housekeeping events per turn; they stay visible but must
     not drown the two lines of actual conversation. */
  .frame.compact { margin-bottom: 3px; }
  .frame.compact .meta { margin-bottom: 0; font-size: 10px; opacity: .7; }
  .frame.compact .body {
    font-size: 11px; color: var(--faint); padding: 3px 8px;
    background: transparent; border-color: transparent;
  }
  .frame.compact:hover .body { background: var(--surface-2); border-color: var(--line-soft); }

  .frame.user .body {
    background: var(--accent-dim); border-color: #2b4570; color: #d6e4ff;
  }
  .frame.user .kind { color: #7fb0ff; }
  .frame.assistant .body { color: #eef2f8; border-color: #2a3446; }
  .frame.assistant .kind { color: var(--ok); }
  .frame.streaming .body::after {
    content: '▌'; color: var(--ok); margin-left: 1px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* ----------------------------------------------------------- composer */
  #composer {
    flex: none; border-top: 1px solid var(--line); padding: 12px 14px;
    display: flex; gap: 10px; align-items: flex-end; background: var(--surface);
  }
  #composer textarea { resize: none; height: 66px; font-family: inherit; line-height: 1.6; }
  #composer .side { display: flex; flex-direction: column; gap: 7px; flex: none; }
  #composer .side button { padding: 7px 16px; }

  /* --------------------------------------------------------- notices */
  #tokenbar, #enrollbar {
    display: none; gap: 10px; align-items: center;
    padding: 11px 14px; font-size: 12.5px; flex: none;
  }
  #tokenbar.on, #enrollbar.on { display: flex; }
  #tokenbar { background: #241d10; border-bottom: 1px solid #4a3a17; color: #e8d6ac; }
  /* A refused token is a different problem from a missing one; the colour says so. */
  #tokenbar.rejected { background: #2c1618; border-bottom-color: #5c2b25; color: #f3c9c4; }
  #tokenbar.rejected strong { color: var(--bad); }
  #tokenbar .sheet, #enrollbar .sheet { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 760px; }
  #tokenbar .sheet-head, #enrollbar .sheet-head { display: flex; align-items: center; gap: 10px; }
  #tokenbar .sheet-head strong, #enrollbar .sheet-head strong { font-size: 13px; font-weight: 600; }
  #tokenbar .hint, #enrollbar .hint { color: var(--dim); font-size: 12px; line-height: 1.65; }
  #tokenbar.rejected .hint { color: #d8a9a3; }
  #tokenbar .controls, #enrollbar .controls { display: flex; gap: 8px; align-items: center; }
  #tokenbar .controls input { max-width: 300px; font-family: var(--mono); }
  #enrollbar { background: var(--surface-2); border-bottom: 1px solid var(--line); }

  /*
    The enrollment panel states what the setting *means*, because the honest answer
    to "what is this?" is not obvious from any short label — the earlier one was
    read as "等级密钥" (a level key) rather than "登记密钥" (an enrollment key).
  */
  #enrollbar .sheet { display: flex; flex-direction: column; gap: 9px; width: 100%; max-width: 760px; }
  #enrollbar .sheet-head { display: flex; align-items: center; gap: 10px; }
  #enrollbar .sheet-head strong { font-size: 13px; font-weight: 600; }
  #enrollbar .sheet-head .spacer { flex: 1; }
  #enrollbar .hint { color: var(--dim); font-size: 12px; line-height: 1.65; }
  #enrollbar .hint code {
    font-family: var(--mono); font-size: 11.5px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  #enrollbar .controls { display: flex; gap: 8px; align-items: center; }
  #enrollbar .controls input { max-width: 300px; font-family: var(--mono); }
</style>
</head>
<body>

<header>
  <h1>DSH Coordinator</h1>
  <span class="pill" id="stat">连接中…</span>
  <span class="spacer"></span>
  <button id="enrolltoggle">令牌</button>
  <button id="refresh">刷新节点</button>
</header>

<div id="tokenbar">
  <div class="sheet">
    <div class="sheet-head"><strong id="tokentitle">该 API 需要运维令牌</strong></div>
    <div class="hint" id="tokenhint">启动 Coordinator 时 --api-token 的值。</div>
    <div class="controls">
      <input id="token" type="password" placeholder="--api-token 的值" autocomplete="off">
      <button id="settoken" class="primary">保存并使用</button>
      <button id="cleartoken" class="ghost">清除</button>
    </div>
  </div>
</div>

<!--
  One token, one rule: a node that presents this token is admitted, and an admitted
  node can be controlled from here. That is the whole model, and the panel says
  exactly that and nothing more.

  Two things it must never do: show the token (the API cannot return it, and a value
  an operator can read back is a value anyone who reached this port can read back
  too), and require the operator to hold a theory. An earlier wording called it
  「登记密钥」 and explained the two roles the value plays on first and later
  connections; it read as 「等级密钥」 to a skimming reader and buried the one sentence
  that mattered.
-->
<div id="enrollbar">
  <div class="sheet">
    <div class="sheet-head">
      <strong>令牌</strong>
      <span class="pill" id="enrollstate">—</span>
      <span class="spacer"></span>
      <button id="enrollhide" class="ghost">收起</button>
    </div>
    <div class="hint">
      节点连接时填上这个令牌，就能连入本网关；连入后即可被这里控制。
    </div>
    <div class="controls">
      <input id="enrollinput" type="password" placeholder="新令牌（留空 = 不修改）" autocomplete="off">
      <button id="enrollsave" class="primary">保存</button>
      <button id="enrollclear">禁止新节点连入</button>
    </div>
  </div>
</div>

<main>
  <section>
    <div class="pane-head"><span>节点</span><span class="spacer"></span><span id="nodecount"></span></div>
    <div class="list" id="nodes"><div class="empty">加载中…</div></div>
  </section>
  <section>
    <div class="pane-head">
      <span>会话</span><span class="spacer"></span>
      <span id="sessioncount"></span>
      <button id="new" disabled>＋ 新建</button>
    </div>
    <div id="sessionfilter-wrap"><input id="sessionfilter" placeholder="按名称 / 目录筛选…" autocomplete="off"></div>
    <div class="list" id="sessions"><div class="empty">先选一个节点</div></div>
  </section>
  <section>
    <div class="pane-head">
      <span id="chat-title">消息</span><span class="spacer"></span>
      <span class="pill" id="chat-state">—</span>
      <button id="reload" disabled>重连流</button>
    </div>
    <div id="log"><div class="empty">选一个会话开始</div></div>
    <div id="composer">
      <textarea id="text" placeholder="给这个会话发一条消息…（Enter 发送，Shift+Enter 换行）" disabled></textarea>
      <div class="side">
        <button id="send" class="primary" disabled>发送</button>
        <button id="newinsession" disabled title="在这个节点上新建会话并切换过去">新建会话</button>
      </div>
    </div>
  </section>
</main>

<script>
'use strict'

// ------------------------------------------------------------------ state

const state = {
  token: readStoredToken(),
  nodes: [],
  nodeId: null,
  sessions: [],
  sessionFilter: '',
  sessionId: null,
  follow: null,       // AbortController for the open follow stream
  entries: [],        // rendered frames, so a reconnect can replay them
}

const $ = id => document.getElementById(id)
const el = (tag, className, text) => {
  const node = document.createElement(tag)
  if (className) node.className = className
  if (text !== undefined) node.textContent = text
  return node
}

/** Read the remembered operator token, tolerating storage being unavailable. */
function readStoredToken () {
  try {
    return localStorage.getItem('dsh.coordinator.token') || ''
  } catch {
    return ''
  }
}

// ------------------------------------------------------------------ api

/**
 * Show the token bar, and say which of the two problems it is.
 *
 * "Missing" and "rejected" look identical to a server (both are a 401) and could not
 * be more different to an operator. Reporting both as "a token is required" is how
 * someone sits there retyping a token the server has already refused — and this
 * service has **two** credentials that look alike, so that happened: the enrollment
 * token a node fills in is not the operator token this page wants.
 * @param rejected - true when a token was supplied and the server refused it.
 */
function needToken (rejected) {
  const bar = $('tokenbar')
  bar.classList.add('on')
  bar.classList.toggle('rejected', rejected === true)
  $('tokentitle').textContent = rejected
    ? '运维令牌被拒绝 —— 服务器不接受这个值'
    : '该 API 需要运维令牌'
  $('tokenhint').textContent = rejected
    ? '注意：这是启动时 --api-token 的值，不是节点用的接入口令。两者通常不相同。'
    : '启动 Coordinator 时 --api-token 的值。绑非回环地址时它是必填的。'
  $('token').focus()
}

/**
 * Call the operator API.
 *
 * Failures arrive as data (`{ok:false,error:{code}}` with HTTP 200) for anything the
 * node reported, so both shapes have to be turned into a throw here — a caller
 * should not have to remember which endpoint reports failure which way.
 */
async function api (path, body, signal) {
  const headers = { 'content-type': 'application/json' }
  const sent = state.token !== ''
  if (sent) headers.authorization = 'Bearer ' + state.token
  const response = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers,
    body: body === undefined ? undefined : JSON.stringify(body),
    ...(signal ? { signal } : {}),
  })
  if (response.status === 401) {
    // A token was sent and refused: saying "a token is required" again would invite
    // the operator to retype exactly what was just rejected.
    needToken(sent)
    throw new Error(sent ? '运维令牌被服务器拒绝' : '需要运维令牌')
  }
  let payload
  try {
    payload = await response.json()
  } catch {
    throw new Error('HTTP ' + response.status + '：响应不是 JSON')
  }
  if (payload && payload.ok === false) {
    const error = payload.error || {}
    throw new Error(error.code ? error.code + '：' + (error.message || '') : '调用失败')
  }
  if (payload && payload.ok === true) return payload.value
  return payload
}

// ------------------------------------------------------------------ log

function clearLog (placeholder) {
  state.entries = []
  const log = $('log')
  log.replaceChildren()
  if (placeholder) log.append(el('div', 'empty', placeholder))
}

/**
 * Append one frame to the message pane.
 * @returns the entry element, so a streaming renderer can keep appending to it.
 */
function addEntry ({ kind, body, className, time, compact }) {
  const log = $('log')
  const placeholder = log.querySelector('.empty')
  if (placeholder) placeholder.remove()

  const frame = el('div', 'frame' + (className ? ' ' + className : '') + (compact ? ' compact' : ''))
  const meta = el('div', 'meta')
  meta.append(el('span', 'kind', kind))
  meta.append(el('span', null, time ? new Date(time).toLocaleTimeString() : new Date().toLocaleTimeString()))
  frame.append(meta)
  const bodyEl = el('div', 'body', body)
  frame.append(bodyEl)
  log.append(frame)
  log.scrollTop = log.scrollHeight

  state.entries.push({ kind, body, className, time, compact })
  return { element: frame, body: bodyEl }
}

/** Add a line that came from this page rather than from a node. */
const note = (text, className) => addEntry({ kind: '本地', body: text, className: className || 'sys' })

// ------------------------------------------------- event payload rendering
//
// The event vocabulary below is what a REAL DSH emits on `session/follow`; it was
// read off a live node, not guessed. Three shapes matter:
//
//   user/message      { content: [{type:'text', text}], role:'user', id, source }
//   assistant/message { turn, step, message: {role:'assistant', content:[…]}, usage, stream }
//   system/message    { turn, step, message: {role:'system', content:[…]} }
//
// plus the housekeeping events (`turn/start`, `step/start`, `request/header`,
// `agent/inbox/spliced`, …) that carry no prose at all. An earlier version looked
// for a top-level `text`/`content` string and therefore rendered *every* real
// message as raw JSON — the fake node hid that, because its events were written to
// match the renderer instead of the other way round.

/** Flatten a DSH content array into text. */
function contentText (content) {
  if (!Array.isArray(content)) return ''
  const parts = []
  for (const part of content) {
    if (!part || typeof part !== 'object') continue
    if (part.type === 'text' && typeof part.text === 'string') parts.push(part.text)
    else if (part.type === 'image') parts.push('[图片]')
    else if (part.type === 'file') parts.push('[文件]')
    else parts.push('[' + (part.type || '?') + ']')
  }
  return parts.join('')
}

/** The message object inside an event payload, whichever wrapper it used. */
function messageOf (data) {
  if (!data || typeof data !== 'object') return undefined
  if (data.message && typeof data.message === 'object' && Array.isArray(data.message.content)) return data.message
  if (Array.isArray(data.content)) return data
  return undefined
}

/** Turn one node event into something worth reading. */
function describeEvent (event) {
  const data = event ? event.data : undefined
  if (typeof data === 'string') return { text: data, plain: true, kind: 'note' }

  const message = messageOf(data)
  if (message !== undefined) {
    const text = contentText(message.content)
    if (text !== '') {
      const role = message.role || String(event.type || '').split('/')[0]
      const kind = role === 'assistant' ? 'assistant' : role === 'user' ? 'user' : 'system'
      return { text, plain: true, kind }
    }
  }

  if (data && typeof data === 'object') {
    if (typeof data.title === 'string' && data.title !== '') return { text: data.title, plain: true, kind: 'title' }
    if (typeof data.text === 'string' && data.text !== '') return { text: data.text, plain: true, kind: 'note' }
  }

  let json
  try {
    json = JSON.stringify(data, null, 2)
  } catch {
    json = String(data)
  }
  return { text: json === undefined ? '(无数据)' : json, plain: false, kind: 'raw' }
}

/** How each kind is labelled and coloured. */
const KIND_STYLE = {
  user: { label: '你', className: 'plain user' },
  assistant: { label: 'AI', className: 'plain assistant' },
  system: { label: '系统', className: 'system compact' },
  title: { label: '标题', className: 'system compact' },
  note: { label: '事件', className: 'plain' },
  raw: { label: '事件', className: 'raw compact' },
}

/** Render one `session/follow` frame. */
function renderFollowFrame (frame) {
  if (!frame || typeof frame !== 'object') return

  if (frame.type === 'snapshot') {
    const records = Array.isArray(frame.records) ? frame.records : []
    state.entries = []
    $('log').replaceChildren()
    const header = frame.header || {}
    note(
      '会话快照：' + (header.id || state.sessionId || '?') +
      (header.cwd ? '\n工作目录：' + header.cwd : '') +
      '\n历史 ' + records.length + ' 条' + (frame.hasMore ? '（还有更多）' : ''),
    )
    for (const record of records) {
      if (record && record.type === 'event' && record.event) renderEvent(record.event)
    }
    return
  }

  if (frame.type === 'event' && frame.event) {
    renderEvent(frame.event)
    return
  }

  // Live model output, only sent when the caller asked for `assistantStream`.
  if (frame.type === 'assistant-stream') {
    renderAssistantStream(frame.frame || {})
    return
  }

  addEntry({ kind: frame.type || '未知帧', body: JSON.stringify(frame, null, 2), className: 'raw compact' })
}

function renderEvent (event) {
  const { text, kind } = describeEvent(event)
  const style = KIND_STYLE[kind] || KIND_STYLE.raw
  addEntry({
    kind: style.label + ' · ' + (event.type || '?'),
    body: text,
    className: style.className,
    time: typeof event.time === 'number' ? event.time : undefined,
    compact: style.className.includes('compact'),
  })
}

// ---------------------------------------------------- live assistant stream

/** The entry the live stream is appending to, if a turn is in flight. */
let liveEntry = null

/**
 * Pull text out of one assistant-stream chunk.
 *
 * The chunk is an opaque `JsonValue` in the protocol, so this accepts every shape
 * the LLM streamer is known to use rather than assuming one. A shape it does not
 * recognise is dropped instead of rendered as `[object Object]`.
 */
function chunkText (chunk) {
  if (typeof chunk === 'string') return chunk
  if (!chunk || typeof chunk !== 'object') return ''
  if (typeof chunk.text === 'string') return chunk.text
  if (typeof chunk.delta === 'string') return chunk.delta
  if (Array.isArray(chunk.texts)) return chunk.texts.join('')
  if (chunk.block && typeof chunk.block.text === 'string' && chunk.type === 'block-end') return chunk.block.text
  return ''
}

function renderAssistantStream (inner) {
  if (inner.type === 'start') {
    liveEntry = null
    return
  }
  if (inner.type === 'end') {
    if (liveEntry) liveEntry.element.classList.remove('streaming')
    liveEntry = null
    return
  }
  if (inner.type !== 'chunk') return
  const delta = chunkText(inner.chunk)
  if (delta === '') return
  if (liveEntry === null) {
    liveEntry = addEntry({ kind: 'AI · 生成中', body: '', className: 'plain assistant streaming' })
  }
  liveEntry.body.textContent += delta
  $('log').scrollTop = $('log').scrollHeight
}

// ------------------------------------------------------------------ nodes

function renderNodes () {
  const list = $('nodes')
  list.replaceChildren()
  $('nodecount').textContent = state.nodes.length ? String(state.nodes.length) : ''

  if (state.nodes.length === 0) {
    list.append(el('div', 'empty', '还没有节点连上来'))
    return
  }
  for (const node of state.nodes) {
    const row = el('div', 'row' + (node.nodeId === state.nodeId ? ' active' : ''))
    const dot = el('span', 'dot ' + (node.revoked ? 'revoked' : node.state))
    row.append(dot)
    const box = el('div', 'name')
    box.append(el('div', 'name', node.nodeName || node.nodeId))
    box.append(el('div', 'sub', node.state + ' · ' + (node.capabilityCount || 0) + ' 能力'))
    row.append(box)
    row.title = node.nodeId
    row.onclick = () => selectNode(node.nodeId)
    list.append(row)
  }
}

async function refreshNodes () {
  try {
    state.nodes = await api('/api/nodes')
    $('stat').textContent = '已连接 · ' + state.nodes.filter(n => n.state === 'ready').length + ' 个就绪'
    renderNodes()
    // A node can drop out from under a selection; keep the panes honest about it.
    if (state.nodeId && !state.nodes.some(n => n.nodeId === state.nodeId)) selectNode(null)
  } catch (error) {
    $('stat').textContent = '未连接'
    const list = $('nodes')
    list.replaceChildren()
    list.append(el('div', 'empty', String(error.message || error)))
  }
}

function selectNode (nodeId) {
  if (state.nodeId === nodeId) return
  state.nodeId = nodeId
  state.sessionId = null
  state.sessions = []
  closeFollow()
  renderNodes()
  clearLog(nodeId ? '正在加载会话…' : '选一个会话开始')
  $('chat-title').textContent = '消息'
  $('chat-state').textContent = '—'
  $('new').disabled = !nodeId
  $('reload').disabled = true
  $('text').disabled = true
  $('send').disabled = true
  $('newinsession').disabled = !nodeId
  if (nodeId) void loadSessions()
  else renderSessions()
}

// ------------------------------------------------------------------ sessions

/** The node's list answer, whatever envelope it chose. */
function sessionItems (value) {
  if (Array.isArray(value)) return value
  if (value && typeof value === 'object') {
    for (const key of ['items', 'sessions', 'entries']) {
      if (Array.isArray(value[key])) return value[key]
    }
  }
  return []
}

/**
 * Where a session's human name lives.
 *
 * A real DSH puts it at `projections.values.title` — the top-level field is empty
 * on every one of 135 real sessions, so reading only that would have silently
 * shown ids forever. The other names are accepted because the shape belongs to the
 * node, and a node is free to be shaped differently.
 */
function sessionTitle (session) {
  const candidates = [
    session?.projections?.values?.title,
    session?.title,
    session?.name,
  ]
  for (const candidate of candidates) {
    if (typeof candidate === 'string' && candidate.trim() !== '') return candidate.trim()
  }
  return ''
}

/** An id short enough to read and long enough to recognise. */
function shortId (id) {
  const text = String(id ?? '')
  return text.length > 16 ? text.slice(0, 10) + '…' + text.slice(-4) : text
}

/** The last path segment, which says more about a session than a uuid does. */
function folderName (path) {
  const text = String(path ?? '').replace(/[\\/]+$/u, '')
  if (text === '') return ''
  const parts = text.split(/[\\/]/u)
  return parts[parts.length - 1] || text
}

/**
 * The label to show for a session.
 *
 * Order matters: a name if there is one, else its folder, else a shortened id.
 * The raw id is never the first choice — it is a uuid, and an operator scanning a
 * list of 135 of them learns nothing.
 */
function sessionLabel (session) {
  const title = sessionTitle(session)
  if (title !== '') return title
  const folder = folderName(session?.cwd)
  if (folder !== '') return folder + '（未命名）'
  return shortId(session?.sessionId ?? session?.id)
}

/** A relative timestamp, which is what "when did I last touch this" actually means. */
function relativeTime (ms) {
  if (typeof ms !== 'number' || !Number.isFinite(ms)) return ''
  const delta = Date.now() - ms
  if (delta < 0) return ''
  if (delta < 60_000) return '刚刚'
  if (delta < 3_600_000) return `${Math.floor(delta / 60_000)} 分钟前`
  if (delta < 86_400_000) return `${Math.floor(delta / 3_600_000)} 小时前`
  if (delta < 30 * 86_400_000) return `${Math.floor(delta / 86_400_000)} 天前`
  return new Date(ms).toLocaleDateString()
}

/** The session a row refers to. */
function sessionOf (session) {
  return String(session?.sessionId ?? session?.id ?? '')
}

/**
 * The shortest trailing fragment that tells these ids apart.
 *
 * A fixed-width truncation is not enough. DSH names child sessions with structured
 * ids (`bt-discuss-…-jobs`), so two of them can share a first-ten and a last-four
 * and differ only in the middle — measured on a real list, that left 8 rows still
 * reading identically. Growing the fragment until it is unique within its group
 * makes the suffix an actual disambiguator, and keeps it short when it can.
 * @param ids - the ids in one colliding group.
 * @returns a Map from id to the shortest distinguishing tail.
 */
function discriminatingSuffixes (ids) {
  const suffixes = new Map()
  for (const id of ids) {
    let width = 4
    for (;;) {
      const candidate = id.slice(-width)
      const clashes = ids.some(other => {
        if (other === id) return false
        return other.slice(-Math.min(width, other.length)) === candidate
      })
      if (!clashes || width >= id.length) break
      width += 1
    }
    suffixes.set(id, id.slice(-width))
  }
  return suffixes
}

/**
 * Assign every session its display label.
 *
 * Two sessions can share a title. DSH generates them, and a real 135-session list
 * had 46 duplicate labels — "You are writing part of…" twice, and worse. A list
 * where two rows read the same is a list you cannot act on, so a repeated label
 * gets a distinguishing tail appended while a unique one stays clean.
 * @param sessions - the node's list items.
 * @returns a Map from item to label.
 */
function sessionLabels (sessions) {
  const base = new Map()
  const groups = new Map()
  for (const session of sessions) {
    const label = sessionLabel(session)
    base.set(session, label)
    if (!groups.has(label)) groups.set(label, [])
    groups.get(label).push(sessionOf(session))
  }

  const labels = new Map()
  const suffixes = new Map()
  for (const [label, ids] of groups) {
    if (ids.length > 1) suffixes.set(label, discriminatingSuffixes(ids))
  }
  for (const session of sessions) {
    const label = base.get(session)
    const byId = suffixes.get(label)
    if (byId === undefined) {
      labels.set(session, label)
      continue
    }
    labels.set(session, `${label} · ${byId.get(sessionOf(session)) ?? shortId(sessionOf(session))}`)
  }
  return labels
}

function renderSessions () {
  const list = $('sessions')
  list.replaceChildren()
  if (!state.nodeId) {
    list.append(el('div', 'empty', '先选一个节点'))
    return
  }
  if (state.sessions.length === 0) {
    list.append(el('div', 'empty', '这个节点还没有会话'))
    return
  }

  const needle = state.sessionFilter.trim().toLowerCase()
  // Repeated titles get a short id appended; see `sessionLabels`.
  const labels = sessionLabels(state.sessions)
  const labelFor = session => labels.get(session) ?? sessionLabel(session)

  const shown = needle === ''
    ? state.sessions
    : state.sessions.filter(session =>
      labelFor(session).toLowerCase().includes(needle) ||
      String(session.cwd ?? '').toLowerCase().includes(needle) ||
      sessionOf(session).toLowerCase().includes(needle))

  if (shown.length === 0) {
    list.append(el('div', 'empty', `没有匹配「${state.sessionFilter}」的会话`))
    $('sessioncount').textContent = `0/${state.sessions.length}`
    return
  }
  $('sessioncount').textContent = needle === ''
    ? String(state.sessions.length)
    : `${shown.length}/${state.sessions.length}`

  for (const session of state.sessions) {
    if (!shown.includes(session)) continue
    const id = sessionOf(session)
    const row = el('div', 'row' + (id === state.sessionId ? ' active' : ''))
    row.append(el('span', 'dot ' + (session.running ? 'ready' : 'offline')))

    const box = el('div', 'name')
    box.append(el('div', 'name', labelFor(session)))

    const bits = []
    if (session.running) bits.push('运行中')
    const folder = folderName(session.cwd)
    if (folder !== '') bits.push(folder)
    const when = relativeTime(session.updatedAt)
    if (when !== '') bits.push(when)
    box.append(el('div', 'sub', bits.join(' · ')))
    row.append(box)

    // The uuid is still available — just not as the thing you have to read.
    row.title = `${sessionTitle(session) || '(未命名)'}\n${id}\n${session.cwd ?? ''}`.trim()
    row.onclick = () => selectSession(id)
    list.append(row)
  }
}

async function loadSessions () {
  const nodeId = state.nodeId
  if (!nodeId) return
  const list = $('sessions')
  list.replaceChildren(el('div', 'empty', '加载中…'))
  try {
    const value = await api('/api/sessions', { nodeId })
    if (state.nodeId !== nodeId) return
    state.sessions = sessionItems(value)
    renderSessions()
  } catch (error) {
    list.replaceChildren(el('div', 'empty', String(error.message || error)))
  }
}

async function createSession () {
  const nodeId = state.nodeId
  if (!nodeId) return
  $('new').disabled = true
  $('newinsession').disabled = true
  try {
    const value = await api('/api/session/create', { nodeId })
    const sessionId = value && (value.sessionId || value.id)
    note('已在 ' + nodeId + ' 上新建会话' + (sessionId ? '：' + shortId(sessionId) : ''))
    await loadSessions()
    if (sessionId) selectSession(sessionId)
  } catch (error) {
    note('创建会话失败：' + (error.message || error), 'err')
  } finally {
    $('new').disabled = !state.nodeId
    $('newinsession').disabled = !state.nodeId
  }
}

// ------------------------------------------------------------------ follow

/** Stop reading the current session, if one is open. */
function closeFollow () {
  if (state.follow) {
    state.follow.abort()
    state.follow = null
  }
}

/**
 * Open the follow stream for a session and render it as it arrives.
 *
 * The response is NDJSON, not one JSON document, so this reads the body by hand
 * rather than using `EventSource` (which cannot POST) or `response.json()` (which
 * would wait for a stream that never ends).
 */
async function openFollow (sessionId) {
  closeFollow()
  const controller = new AbortController()
  state.follow = controller
  $('chat-state').textContent = '连接中'

  const headers = { 'content-type': 'application/json' }
  if (state.token) headers.authorization = 'Bearer ' + state.token

  let response
  try {
    response = await fetch('/api/session/follow', {
      method: 'POST',
      headers,
      body: JSON.stringify({ nodeId: state.nodeId, sessionId, assistantStream: true }),
      signal: controller.signal,
    })
  } catch (error) {
    if (!controller.signal.aborted) note('打开流失败：' + (error.message || error), 'err')
    return
  }
  if (response.status === 401) { needToken(state.token !== ''); return }
  if (!response.ok) {
    note('打开流失败：HTTP ' + response.status, 'err')
    return
  }

  $('chat-state').textContent = '已连接'
  const reader = response.body.getReader()
  const decoder = new TextDecoder()
  let buffer = ''

  try {
    for (;;) {
      const { done, value } = await reader.read()
      if (done) break
      buffer += decoder.decode(value, { stream: true })
      let index
      while ((index = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, index).trim()
        buffer = buffer.slice(index + 1)
        if (line) handleStreamLine(line)
      }
    }
    if (buffer.trim()) handleStreamLine(buffer.trim())
    if (!controller.signal.aborted) {
      $('chat-state').textContent = '已结束'
      note('流已结束')
    }
  } catch (error) {
    if (!controller.signal.aborted) {
      $('chat-state').textContent = '已断开'
      note('流中断：' + (error.message || error), 'err')
    }
  }
}

/** Handle one NDJSON envelope from `/api/session/follow`. */
function handleStreamLine (line) {
  let envelope
  try {
    envelope = JSON.parse(line)
  } catch {
    note('无法解析的帧：' + line, 'err')
    return
  }
  if (envelope.type === 'open') {
    $('chat-state').textContent = '已连接 · ' + envelope.streamId
    return
  }
  if (envelope.type === 'data') {
    renderFollowFrame(envelope.value)
    return
  }
  if (envelope.type === 'end') {
    $('chat-state').textContent = '已结束'
    note('节点结束了这条流（' + (envelope.count || 0) + ' 个值）')
    return
  }
  if (envelope.type === 'error') {
    const error = envelope.error || {}
    $('chat-state').textContent = '出错'
    note('流错误：' + (error.code || '') + ' ' + (error.message || ''), 'err')
    return
  }
  note('未知信封：' + line, 'raw')
}

function selectSession (sessionId) {
  if (state.sessionId === sessionId) return
  state.sessionId = sessionId
  renderSessions()

  // The pane header gets the name, not the uuid — but the uuid stays in the
  // tooltip, because it is what a curl command or a log line will call this.
  const session = state.sessions.find(entry => sessionOf(entry) === sessionId)
  const title = sessionTitle(session)
  const label = sessionLabel(session ?? { sessionId })
  const heading = $('chat-title')
  heading.textContent = label
  heading.title = `${title || '(未命名)'}\n${sessionId}`

  $('reload').disabled = false
  $('text').disabled = false
  $('send').disabled = false
  clearLog('正在打开这条会话的流…')
  void openFollow(sessionId)
}

// ------------------------------------------------------------------ prompt

async function send () {
  const text = $('text').value.trim()
  if (!text || !state.sessionId || !state.nodeId) return
  $('text').value = ''
  $('send').disabled = true
  addEntry({ kind: '我 → ' + state.nodeId, body: text, className: 'plain' })
  try {
    await api('/api/session/prompt', {
      nodeId: state.nodeId,
      sessionId: state.sessionId,
      text,
    })
  } catch (error) {
    note('发送失败：' + (error.message || error), 'err')
  } finally {
    $('send').disabled = false
  }
}

// -------------------------------------------------------------- enrollment

/**
 * Read the enrollment state.
 *
 * The answer is a fact (`open` / `persisted`), never the secret. That is not a
 * limitation of this page — the route has no way to return one.
 */
async function loadEnrollment () {
  const pill = $('enrollstate')
  try {
    const value = await api('/api/enrollment')
    // "Set / not set", which is the operator's question. Where it is stored is a
    // tooltip, not a status: it only matters when it would be lost.
    pill.textContent = value.open ? (value.persisted ? '已设置' : '已设置 · 重启会丢') : '未设置'
    pill.className = 'pill ' + (value.open ? 'ok' : 'off')
    pill.title = value.stateFile ? '保存在 ' + value.stateFile : '没有配置状态文件，重启会丢失'
  } catch (error) {
    pill.textContent = '未知'
    pill.className = 'pill off'
    pill.title = String(error.message || error)
  }
}

/** Send a new token, or null to stop admitting new nodes. */
async function setEnrollment (secret) {
  $('enrollsave').disabled = true
  $('enrollclear').disabled = true
  try {
    const value = await api('/api/enrollment', { token: secret })
    $('enrollinput').value = ''
    note(secret === null
      ? '已禁止新节点连入 —— 已连入的节点不受影响'
      : '令牌已保存' + (value.persisted ? '，重启后仍然有效' : '（仅内存，重启会丢失）'))
    await loadEnrollment()
  } catch (error) {
    note('保存令牌失败：' + (error.message || error), 'err')
  } finally {
    $('enrollsave').disabled = false
    $('enrollclear').disabled = false
  }
}

// ------------------------------------------------------------------ wiring

$('refresh').onclick = () => { void refreshNodes() }
$('new').onclick = () => { void createSession() }
$('newinsession').onclick = () => { void createSession() }
$('reload').onclick = () => { if (state.sessionId) void openFollow(state.sessionId) }
$('send').onclick = () => { void send() }
$('enrolltoggle').onclick = () => {
  const bar = $('enrollbar')
  bar.classList.toggle('on')
  if (bar.classList.contains('on')) {
    void loadEnrollment()
    $('enrollinput').focus()
  }
}
$('enrollhide').onclick = () => { $('enrollbar').classList.remove('on') }
$('enrollsave').onclick = () => {
  const secret = $('enrollinput').value.trim()
  if (secret === '') {
    note('输入框是空的 —— 留空表示"不修改"。要停止接纳新节点，请点「禁止新节点连入」。', 'sys')
    return
  }
  void setEnrollment(secret)
}
$('enrollclear').onclick = () => { void setEnrollment(null) }
$('sessionfilter').addEventListener('input', event => {
  state.sessionFilter = event.target.value
  renderSessions()
})
$('enrollinput').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault()
    $('enrollsave').click()
  }
})
$('text').addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault()
    void send()
  }
})
/*
  Storage is wrapped, not because it usually fails but because of how it fails when
  it does: `localStorage.setItem` throws in a private window or under a storage
  policy, and an unguarded throw here would abandon the handler *after* setting the
  token in memory but *before* hiding the bar and retrying — leaving an operator
  staring at a prompt that ignores everything they type.
*/
function rememberToken (value) {
  try {
    if (value === '') localStorage.removeItem('dsh.coordinator.token')
    else localStorage.setItem('dsh.coordinator.token', value)
  } catch {
    note('浏览器拒绝保存令牌（隐私模式或存储被禁用）—— 本次有效，刷新后需要重填。', 'sys')
  }
}

$('settoken').onclick = () => {
  state.token = $('token').value.trim()
  rememberToken(state.token)
  $('tokenbar').classList.remove('on', 'rejected')
  void refreshNodes()
  void loadEnrollment()
}
$('cleartoken').onclick = () => {
  state.token = ''
  rememberToken('')
  $('token').value = ''
  void refreshNodes()
}
$('token').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault()
    $('settoken').click()
  }
})
$('token').value = state.token

void refreshNodes()
void loadEnrollment()
setInterval(() => { void refreshNodes() }, 5000)
</script>
</body>
</html>
